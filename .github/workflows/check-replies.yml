name: Check Gmail Replies

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-replies:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Create temporary credential files
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          python -c "import os, pathlib; pathlib.Path('service_account.json').write_text(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON'], encoding='utf-8'); pathlib.Path('gmail_credentials.json').write_text(os.environ['GMAIL_CREDENTIALS_JSON'], encoding='utf-8'); pathlib.Path('gmail_token.json').write_text(os.environ['GMAIL_TOKEN_JSON'], encoding='utf-8')"

      - name: Check Gmail replies
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_WORKSHEET_NAME: ${{ secrets.GOOGLE_WORKSHEET_NAME }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
        run: python check_replies.py

      - name: Remove temporary credential files
        if: always()
        run: rm -f service_account.json gmail_credentials.json gmail_token.json
